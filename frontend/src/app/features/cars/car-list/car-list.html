<section class="car-list">
    <header class="car-list__header">
        <p class="car-list__eyebrow">Gestión de inventario</p>
        <h2 class="car-list__title">Listado de vehículos</h2>
        <p class="car-list__description">Consulta los vehículos registrados en el sistema.</p>
    </header>

    <div class="car-list__table-wrapper">
        <table class="car-list__table">
            <thead class="car-list__table-head">
                <tr>
                    <th scope="col">Marca</th>
                    <th scope="col">Modelo</th>
                    <th scope="col">Total</th>
                </tr>
            </thead>
            <tbody class="car-list__table-body">
                @for (car of cars(); track car.id) {
                <tr class="car-list__row">
                    <td>{{ car.brand.name }}</td>
                    <td>{{ car.model.name }}</td>
                    <td>{{ car.total }}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>

    <p class="car-list__count">Vehículos cargados: {{ cars().length }}</p>
</section>
